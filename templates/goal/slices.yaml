schema_version: 1
feature: "<feature-id>"

slices:
  - id: R01
    task_ids:
      - T01
    lane: CONTRACT # CONTRACT | FE_MOCK_LOOP | SERVER_CAPABILITY | MOCK_REPLACEMENT | INTEGRATION | QA
    user_path: "<this slice's user-visible path>"
    tooling_prerequisite_ids: [] # 例如 TP-001；无第三方工具依赖时为空
    evidence:
      level: "<E0 | E1 | E2 | E3>"
      expected_baseline: "<requirement / ui-flow / prototype / existing page / API contract / none>"
      gate: "<none | api_data | smoke | implementation_screenshot | before_after | prototype_compare | role_compare | multi_client>"
      required_states: []
      required_roles: []
      required_clients: []
      shared_with_task_ids: []
      pre_cr_ui_check: "轻量检查：主路径可达、基线可读取、无明显契约偏差"
      final_capture_timing: "有阻塞：修复完成、准备复审前；零阻塞：首轮审查后立即采集"
      zero_blocker_confirmation: ".goal/cr/<slice>-evidence-confirmation-<n>.md；优先原审查者，不可用时同职责独立审查者接替"
      max_ui_capture_methods: 2
      max_attempts_per_method: 2
      fallback: "只更换采集手段、不降低证据等级；E2/E3 无等价视觉证据时人工介入或阻塞"
    scope:
      - "<minimal implementation scope>"
    non_goals:
      - "<explicitly out of this slice>"
    dependencies: []
    parallel_group: null
    implementation_owner:
      mode: main_thread # main_thread | worker | hybrid
      reason: "<why this owner improves first-pass quality>"
      main_thread_may_edit:
        - "<files/modules the main thread may edit>"
      worker_scope:
        - "<files/modules worker may edit, or none>"
      independent_validation_required: true
      independent_cr_required: true
      max_fix_rounds_per_finding: 2
      max_pre_cr_validation_rounds: 1
    gate_level: development # development | release_gate
    worktree:
      allowed: false
      ownership:
        - "<files or modules this slice may edit>"
      merge_order: null
      conflict_policy: "shared contracts must return to main agent"
    workers:
      implementer:
        required: true
        output_pattern: ".goal/runs/R01-implementer-{n}.md"
        scope_guard:
          - "only edit files listed in ownership or slice scope"
          - "do not update .goal/status.yaml"
      fixer:
        required_when: "CR or validation finds agent-solvable issues"
        output_pattern: ".goal/runs/R01-fixer-{n}.md"
    validators:
      - kind: contract
        required: true
        command: "<contract or API validation command>"
        output_pattern: ".goal/validation/R01-contract-{n}.md"
      - kind: smoke
        required: false
        command: "<UI or integration smoke command>"
        output_pattern: ".goal/validation/R01-smoke-{n}.md"
      - kind: ui-drift
        required_when: "slice touches frontend page, admin tool, workflow UI, form, table, review flow, or complex UI state"
        timing: "首次代码审查前轻量检查；完成阻塞修复、准备复审前最终对比；后续仅复验被界面修复影响的状态"
        command: "先做轻量路径检查；最终阶段再对照 ui-flow.md / prototype / Open Design 产物（Open Design artifact）并留证；存在 .agents/skills/impeccable 时执行映射命令"
        output_pattern: ".goal/validation/R01-ui-drift-{n}.md"
      - kind: concurrency-checklist
        required_when: "slice touches job/lease/lock/approval race/identity transition"
        command: "cover lock-time recheck, lease token, awaited persistence, identity migration, approved-only reread before declaring pass"
        output_pattern: ".goal/validation/R01-concurrency-{n}.md"
    mock_ledger:
      creates: []
      closes: []
      ledger_path: ".goal/mock-ledger.md"
    todo_ledger:
      creates: []
      closes: []
      ledger_path: ".goal/todo-ledger.md"
      non_blocking_policy: "local pending questions, demand improvements, and UX suggestions do not block the next slice unless they break current P0/P1 acceptance, data/permission/state correctness, or cannot be isolated by mock/adapter"
    required_docs:
      - ".goal/acceptance.md"
      - "tasks.md"
      - ".goal/tooling-prerequisites.yaml" # tooling_prerequisite_ids 非空时必读
      # only add more docs that this slice actually needs as delta evidence
    tests:
      - command: "<test command>"
        required: true
        purpose: "<what this proves>"
    exit:
      - implementation_report_present
      - validation_reports_present_or_waived
      - ui_drift_passed_or_skipped_when_frontend
      - evidence_gate_satisfied_or_waived
      - final_evidence_confirmation_present_or_not_applicable
      - final_evidence_confirmation_code_unchanged_or_new_cr_present
      - spec_green
      - cr_blocking_findings_zero
      - non_blocking_findings_routed
      - no_new_unregistered_mock
      - mock_ledger_updated
      - worktree_merged_or_not_used
      - status_updated
      - resume_snapshot_synced
    cr:
      required: true
      reviewer_kind: subagent
      reviewer_roles:
        - Backend
        - Delivery
      output_pattern: ".goal/cr/R01-round-{n}.md"
      pass_condition:
        blocking_findings: 0
        non_blocking_routing_allowed: true
        human_intervention_allowed: true

  - id: R99
    task_ids:
      - QA
    lane: QA
    user_path: "global exit"
    tooling_prerequisite_ids: []
    evidence:
      level: "<汇总验收项要求的最高证据等级>"
      expected_baseline: ".goal/acceptance.md + 各任务已确认基线"
      gate: "<汇总各验收项所需门禁，不得固定降级为 api_data>"
      required_states: []
      required_roles: []
      required_clients: []
      shared_with_task_ids: []
      pre_cr_ui_check: "not_applicable"
      final_capture_timing: "汇总各切片已确认的最终证据；缺失时在最终复审前补齐"
      zero_blocker_confirmation: "复用各开发切片 evidence-confirmation；全局新增证据由发布审查者确认"
      max_ui_capture_methods: 2
      max_attempts_per_method: 2
      fallback: "复用开发切片证据；缺失时按风险补验或登记人工介入"
    scope:
      - "run final acceptance and smoke"
      - "clear deferred items"
      - "verify no unregistered HTTP mock remains"
    non_goals: []
    dependencies:
      - R01
    parallel_group: null
    implementation_owner:
      mode: main_thread
      reason: "global exit and release readiness require main-thread integration ownership"
      main_thread_may_edit:
        - ".goal/**"
        - "<release/smoke docs or scripts>"
      worker_scope: []
      independent_validation_required: true
      independent_cr_required: true
      max_fix_rounds_per_finding: 2
      max_pre_cr_validation_rounds: 1
    gate_level: release_gate
    worktree:
      allowed: false
      ownership: []
      merge_order: final
      conflict_policy: "main agent owns final integration"
    workers:
      implementer:
        required: false
        output_pattern: ".goal/runs/R99-implementer-{n}.md"
      fixer:
        required_when: "global exit finds agent-solvable issues"
        output_pattern: ".goal/runs/R99-fixer-{n}.md"
    validators:
      - kind: global-exit
        required: true
        command: "<global acceptance and smoke command>"
        output_pattern: ".goal/validation/R99-global-exit-{n}.md"
      - kind: mock-ledger
        required: true
        command: "<mock cleanup check command>"
        output_pattern: ".goal/validation/R99-mock-ledger-{n}.md"
    mock_ledger:
      creates: []
      closes:
        - "*"
      ledger_path: ".goal/mock-ledger.md"
    todo_ledger:
      creates: []
      closes:
        - "review-with-human"
      ledger_path: ".goal/todo-ledger.md"
      final_action: "summarize open TODO items for human alignment; do not mark them as blockers unless they invalidate acceptance or require human intervention"
    required_docs:
      - ".goal/GOAL.md"
      - ".goal/acceptance.md"
      - ".goal/tooling-prerequisites.yaml"
      - ".goal/risks-deferred.md"
      - ".goal/mock-ledger.md"
      - ".goal/worktree-plan.md"
    tests:
      - command: "<smoke or build command>"
        required: true
        purpose: "global exit"
    exit:
      - implementation_report_present_if_any
      - validation_reports_present_or_waived
      - p0_acceptance_green_or_waived
      - open_deferred_zero
      - open_blocker_zero
      - open_cr_blocking_findings_zero
      - p2_nit_closed_or_waived_for_release
      - human_intervention_zero_or_state_needs_human_intervention
      - http_mock_zero_or_waived
      - mock_ledger_zero_or_waived
      - all_worktrees_merged_or_blocked
      - smoke_status_recorded
      - final_evidence_mapped_to_acceptance
      - final_evidence_confirmation_present_or_not_applicable
      - final_evidence_confirmation_code_unchanged_or_new_cr_present
      - status_complete_or_needs_human_intervention
    cr:
      required: true
      reviewer_kind: subagent
      reviewer_roles:
        - Delivery
        - Release
      output_pattern: ".goal/cr/R99-round-{n}.md"
      pass_condition:
        blocking_findings: 0
        all_findings_closed_or_waived: true
        human_intervention_allowed: true
