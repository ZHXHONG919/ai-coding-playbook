<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>批量审核原型 v3 · 教学夹具</title>
<style>body{margin:0;background:#f4f5f7;font:16px system-ui;color:#202938}main{box-sizing:border-box;width:960px;min-height:560px;padding:36px;margin:auto;background:white}h1{font-size:26px;margin:0 0 12px}p{line-height:1.7}button{font:inherit;padding:10px 18px;border-radius:5px;border:1px solid #b8c1cd;background:white;margin:8px 8px 0 0;cursor:pointer}button.primary{background:#245bd6;color:white;border-color:#245bd6}button:disabled{opacity:.45;cursor:default}table{border-collapse:collapse;width:100%;margin:24px 0}td,th{text-align:left;padding:15px 10px;border-bottom:1px solid #dce1e8}aside{padding:16px;background:#f0f5ff}dialog{width:460px;border:1px solid #ccd3de;border-radius:8px;padding:28px}dialog::backdrop{background:#0005}.error{color:#a92d2d;background:#fff0f0;padding:14px}nav{margin:16px auto;width:960px;font-size:13px;color:#617084}</style>
<main id="app"></main><dialog id="confirm"><h2>确认批量通过</h2><p>将提交选中的 <b id="count"></b> 条内容，提交后可查看逐条处理结果。</p><button id="cancel">取消</button><button class="primary" id="send">确认提交</button></dialog>
<nav>教学原型状态控制：<button id="finish">模拟处理完成</button><button id="fail">模拟查询失败</button><button id="reset">重置</button></nav>
<script>
const app=document.querySelector('#app'), modal=document.querySelector('#confirm');let checked=new Set(), state='list',error=false;
const rows=[['内容甲','待审核'],['内容乙','待审核'],['内容丙','已通过']];
function draw(){if(state==='list'){app.innerHTML='<p>审核工作台 / 内容列表</p><h1>内容审核</h1><p>选择内容后批量通过。提交接收后异步处理。</p><table><thead><tr><th>选择</th><th>内容</th><th>当前状态</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr><td><input aria-label="选择'+r[0]+'" type="checkbox" data-i="'+i+'" '+(checked.has(i)?'checked':'')+'></td><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('')+'</tbody></table><aside>已选择 '+checked.size+' 条内容</aside><button class="primary" id="open" '+(!checked.size?'disabled':'')+'>批量通过</button>';app.querySelectorAll('input').forEach(e=>e.onchange=()=>{e.checked?checked.add(+e.dataset.i):checked.delete(+e.dataset.i);draw()});app.querySelector('#open').onclick=()=>{document.querySelector('#count').textContent=checked.size;modal.showModal()};return;}
const done=state==='done';app.innerHTML='<p>审核工作台 / 批次结果</p><h1>批量审核结果</h1><p>批次 aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa</p><aside>'+(done?'处理完成：成功 2 · 业务失败 1 · 系统错误 0':'处理中：待完成 3 · 成功 0 · 失败 0')+'</aside>'+(error?'<p class="error">查询失败，保留当前结果。请重试。</p><button id="retry">重试查询</button>':'')+'<table><thead><tr><th>内容</th><th>本次结果</th><th>说明</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr><td>'+r[0]+'</td><td>'+(done?(i===2?'业务失败':'成功'):'待完成')+'</td><td>'+(done&&i===2?'内容已不处于待审核状态':'—')+'</td></tr>').join('')+'</tbody></table><button id="back">返回内容列表</button>';app.querySelector('#back').onclick=()=>{state='list';error=false;draw()};if(error)app.querySelector('#retry').onclick=()=>{error=false;draw()};}
document.querySelector('#cancel').onclick=()=>modal.close();document.querySelector('#send').onclick=()=>{modal.close();state='pending';error=false;location.hash='/review/batches/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';draw()};document.querySelector('#finish').onclick=()=>{if(state!=='list'){state='done';error=false;draw()}};document.querySelector('#fail').onclick=()=>{if(state!=='list'){error=true;draw()}};document.querySelector('#reset').onclick=()=>{state='list';error=false;checked.clear();location.hash='';draw()};draw();
</script></html>
