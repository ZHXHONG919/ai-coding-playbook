<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="950" viewBox="0 0 1050 950"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1050" height="950" fill="white"/><style>text{font-family:"Heiti SC",sans-serif;fill:#203047;font-size:15px}.title{font-size:22px;font-weight:bold}.lane{fill:#f7f9fc;stroke:#cbd5e1}.step{fill:#e8f1fb;stroke:#adc3dc}.link{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}</style><text x="525" y="36" text-anchor="middle" class="title">UC-01 泳道图｜异步执行与单项事务</text><rect class="lane" x="30" y="60" width="310" height="810" rx="8"/><text x="185" y="87" text-anchor="middle">管理端</text><rect class="lane" x="360" y="60" width="310" height="810" rx="8"/><text x="515" y="87" text-anchor="middle">HTTP API 模块</text><rect class="lane" x="690" y="60" width="310" height="810" rx="8"/><text x="845" y="87" text-anchor="middle">Worker 模块</text><rect class="step" x="45" y="110" width="280" height="76" rx="7"/><text x="185" y="135" text-anchor="middle">确认提交</text><text x="185" y="155" text-anchor="middle">生成请求标识</text><rect class="step" x="375" y="220" width="280" height="76" rx="7"/><text x="515" y="245" text-anchor="middle">检查权限、参数与请求去重</text><text x="515" y="265" text-anchor="middle">短事务保存批次及待处理项</text><rect class="step" x="45" y="330" width="280" height="76" rx="7"/><text x="185" y="355" text-anchor="middle">收到 202 与批次 ID</text><text x="185" y="375" text-anchor="middle">查询进度与逐条结果</text><rect class="step" x="705" y="330" width="280" height="76" rx="7"/><text x="845" y="355" text-anchor="middle">轮询并领取到期项</text><text x="845" y="375" text-anchor="middle">行锁、领取凭证、30 秒租约</text><rect class="step" x="705" y="440" width="280" height="76" rx="7"/><text x="845" y="465" text-anchor="middle">单项事务：锁项并校验凭证</text><text x="845" y="485" text-anchor="middle">检查状态及剩余租约</text><rect class="step" x="705" y="550" width="280" height="76" rx="7"/><text x="845" y="575" text-anchor="middle">事务执行：成功 / 业务失败写终态</text><text x="845" y="595" text-anchor="middle">系统异常回滚，不保留部分写入</text><rect class="step" x="705" y="660" width="280" height="76" rx="7"/><text x="845" y="685" text-anchor="middle">暂时故障：2秒 / 5秒后重试</text><text x="845" y="705" text-anchor="middle">最多3次，超限记系统失败</text><rect class="step" x="705" y="770" width="280" height="76" rx="7"/><text x="845" y="795" text-anchor="middle">所有条目终态后</text><text x="845" y="815" text-anchor="middle">补写批次完成时间</text><path class="link" d="M325,148 L375,258"/><path class="link" d="M375,296 L325,368"/><path class="link" d="M655,258 L705,368"/><text x="680" y="306" text-anchor="middle">异步发现</text><path class="link" d="M845,406 L845,440"/><path class="link" d="M845,516 L845,550"/><path class="link" d="M845,626 L845,660"/><text x="860" y="648">系统异常</text><path class="link" d="M845,736 L845,770"/><text x="860" y="758">重试耗尽</text><path class="link" d="M705,588 L695,588 L695,808 L705,808"/><text x="690" y="753" text-anchor="end">成功 / 业务失败</text><path class="link" d="M985,698 L1015,698 L1015,368 L985,368"/><text x="1005" y="535" text-anchor="end">到期 / 重领</text><rect x="30" y="890" width="970" height="42" rx="6" fill="#f2f5f9"/><text x="48" y="916">说明：成功、业务失败及重试耗尽均进入终态；业务写入与成功结果同事务提交。</text></svg>